schema_version: 1

context:
  version: "1.5.0"

package:
  name: r-palaeoverse
  version: ${{ version }}

source:
  url:
    - ${{ cran_mirror }}/src/contrib/palaeoverse_${{ version }}.tar.gz
    - ${{ cran_mirror }}/src/contrib/Archive/palaeoverse/palaeoverse_${{ version }}.tar.gz
  sha256: 950c2f7c4cd0d2bc4c4a926369183f74a6123e476dde4f82cd9ffee483950989

build:
  number: 1
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-ape
    - r-curl
    - r-geosphere
    - r-h3jsr >=1.3.0
    - r-httr
    - r-lifecycle
    - r-pbapply
    - r-sf
    - r-stringdist
  run:
    - r-base
    - r-ape
    - r-curl
    - r-geosphere
    - r-h3jsr >=1.3.0
    - r-httr
    - r-lifecycle
    - r-pbapply
    - r-sf
    - r-stringdist

tests:
  - r:
      libraries:
        - palaeoverse
  - files:
      source:
        - tests/
    requirements:
      run:
        - r-testthat
    script:
      - R -e "testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)"

about:
  license: GPL-3.0-or-later
  summary: R package developed by palaeobiologists, for palaeobiologists
  description: |
    Provides functionality to support data preparation and exploration for palaeobiological
    analyses, improving code reproducibility and accessibility. The wider aim of "palaeoverse"
    is to bring the palaeobiological community together to establish agreed standards.
    The package currently includes functionality for data cleaning, binning (time and
    space), exploration, summarisation and visualisation. Reference datasets (i.e. Geological
    Time Scales <https://stratigraphy.org/chart>) and auxiliary functions are also provided.
    Details can be found in: Jones et al., (2023) <doi: 10.1111/2041-210X.14099>.
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/GPL-3
  homepage: https://palaeoverse.palaeoverse.org
  repository: https://github.com/palaeoverse/palaeoverse
  documentation: https://palaeoverse.palaeoverse.org/

extra:
  recipe-maintainers:
    - LewisAJones
    - conda-forge/r
    - willgearty
